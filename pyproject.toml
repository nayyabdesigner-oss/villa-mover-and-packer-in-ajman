[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "villa-mover"
version = "0.1.0"
description = "Villa Mover and Packer service in Ajman"
requires-python = ">=3.9"
license = {text = "EPL-2.0"}
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/villa_mover --cov-report=term-missing"

[tool.coverage.run]
source = ["src/villa_mover"]

[tool.coverage.report]
show_missing = true
fail_under = 80
